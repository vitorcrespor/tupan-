# Legacy development scaffolding. The supported application API is
# ceres/backend/api/main.py (backend.api.main:app); do not deploy these services.
version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tupan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    profiles: ['retired']
    build: ./backend
    working_dir: /app
    command: npm run dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tupan
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - postgres

  backend-fastapi:
    profiles: ['retired']
    build: ./backend-fastapi
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tupan
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  db_data:
