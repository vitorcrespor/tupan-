# Canonical Railway API service configuration. Create a second Railway service
# from the same repository/image for the worker and override its start command
# with `python -m backend.worker` (it must not expose an HTTP health check).

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
